<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F2A4A">
<title>SGQ Obra — Gestão da Qualidade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>/* ===== SGQ Obra — identidade visual ===== */
:root {
  --verde: #0b8457;
  --verde-escuro: #086a46;
  --verde-claro: #e6f4ee;
  --navy: #0f2a4a;
  --navy-2: #163a63;
  --navy-claro: #e8eef6;
  --vermelho: #c6362c;
  --vermelho-claro: #fbeceb;
  --amarelo: #c77c02;
  --amarelo-claro: #fdf3e1;
  --cinza-claro: #eef1f4;
  --fundo: #f4f6f9;
  --superficie: #ffffff;
  --borda: #e1e6ec;
  --borda-forte: #cdd5de;
  --texto: #1b2a3a;
  --texto-2: #5a6b7d;
  --texto-3: #8796a6;
  --raio: 12px;
  --raio-sm: 8px;
  --sombra: 0 1px 2px rgba(15, 42, 74, 0.06), 0 2px 8px rgba(15, 42, 74, 0.05);
  --sombra-lg: 0 12px 40px rgba(15, 42, 74, 0.18);
  --fonte: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --sidebar: 264px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--fonte);
  font-size: 14px;
  line-height: 1.5;
  color: var(--texto);
  background: var(--fundo);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--verde-escuro); }
h1, h2, h3, h4 { margin: 0; color: var(--navy); letter-spacing: -0.01em; }
.muted { color: var(--texto-3); }
.nowrap { white-space: nowrap; }
.centro { display: flex; justify-content: center; padding: 16px; }
.alerta-txt { color: #f4c56a !important; }

/* ===== Estrutura ===== */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar);
  flex-shrink: 0;
  background: var(--navy);
  color: #c9d6e6;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 40;
}
.marca { display: flex; align-items: center; gap: 12px; padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.marca strong { display: block; color: #fff; font-size: 16px; letter-spacing: 0.01em; }
.marca span { font-size: 12px; color: #8fa6c1; }
.marca-logo {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, var(--verde), #13a874);
  display: grid; place-items: center; color: #fff; font-size: 21px;
  box-shadow: 0 4px 12px rgba(11,132,87,0.35);
}
.marca-logo.grande { width: 64px; height: 64px; font-size: 34px; border-radius: 16px; }
nav { padding: 8px 10px 16px; flex: 1; }
.nav-grupo { margin-top: 10px; }
.nav-titulo { margin: 8px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6f88a6; font-weight: 600; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  color: #c9d6e6; text-decoration: none; font-size: 13.5px;
  position: relative;
}
.nav-item svg { font-size: 17px; flex-shrink: 0; opacity: 0.85; }
.nav-item span { flex: 1; min-width: 0; }
.nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-item.ativo { background: rgba(11,132,87,0.22); color: #fff; font-weight: 500; }
.nav-item.ativo::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: #2fd197; }
.nav-etapa { font-style: normal; font-size: 10px; color: #7c93ad; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 0 7px; line-height: 17px; }
.sidebar-rodape { padding: 12px 18px 16px; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-rodape span { display: inline-flex; gap: 6px; align-items: center; color: #8fd9b9; }
.sidebar-veu { display: none; }

.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 28px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--borda);
}
.menu-btn { display: none; }
.busca-global {
  flex: 1; max-width: 560px;
  display: flex; align-items: center; gap: 8px;
  background: var(--fundo); border: 1px solid var(--borda); border-radius: 10px; padding: 0 12px;
}
.busca-global svg { color: var(--texto-3); flex-shrink: 0; }
.busca-global input { border: 0; background: transparent; outline: none; padding: 9px 0; width: 100%; }
.busca-global:focus-within { border-color: var(--verde); background: #fff; box-shadow: 0 0 0 3px var(--verde-claro); }
.obra-foco { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--texto-2); }
.obra-foco select { min-width: 220px; max-width: 320px; }
.faixa-local {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  background: var(--amarelo-claro); color: #7a4c00; border-bottom: 1px solid #f1dcb3;
  padding: 8px 28px; font-size: 13px;
}
.faixa-local a { margin: 0 4px; font-weight: 600; color: #7a4c00; }
.conteudo { padding: 24px 28px 48px; max-width: 1440px; width: 100%; }

/* ===== Página ===== */
.pagina { display: flex; flex-direction: column; gap: 18px; }
.pagina-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { margin: 0 0 2px; font-size: 12px; font-weight: 600; color: var(--verde); text-transform: uppercase; letter-spacing: 0.07em; }
.pagina-head h1 { font-size: 24px; font-weight: 700; }
.pagina-desc { margin: 4px 0 0; color: var(--texto-2); max-width: 720px; }
.pagina-acoes { display: flex; gap: 8px; flex-wrap: wrap; }

/* ===== Botões ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 9px; border: 1px solid transparent;
  font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
}
.btn svg { font-size: 16px; flex-shrink: 0; }
.btn-md { padding: 8px 14px; font-size: 13.5px; min-height: 38px; }
.btn-sm { padding: 5px 10px; font-size: 12.5px; min-height: 30px; }
.btn-primary { background: var(--verde); color: #fff; box-shadow: 0 1px 2px rgba(11,132,87,0.3); }
.btn-primary:hover { background: var(--verde-escuro); }
.btn-navy { background: var(--navy); color: #fff; }
.btn-secondary { background: #fff; border-color: var(--borda-forte); color: var(--navy); }
.btn-secondary:hover { border-color: var(--navy-2); background: var(--navy-claro); }
.btn-ghost { background: transparent; color: var(--texto-2); }
.btn-ghost:hover { background: var(--cinza-claro); color: var(--navy); }
.btn-danger { background: var(--vermelho); color: #fff; }
.btn-danger:hover { background: #a92c23; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, .th-btn:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
.icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; font-size: 20px; color: var(--texto-2); flex-shrink: 0; }
.icon-btn:hover { background: var(--cinza-claro); color: var(--navy); }

/* ===== Selos ===== */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 20px; white-space: nowrap; }
.badge-verde { background: var(--verde-claro); color: var(--verde-escuro); }
.badge-vermelho { background: var(--vermelho-claro); color: var(--vermelho); }
.badge-amarelo { background: var(--amarelo-claro); color: #8f5900; }
.badge-azul { background: var(--navy-claro); color: var(--navy-2); }
.badge-cinza { background: var(--cinza-claro); color: var(--texto-2); }
.tags { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.ponto { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ponto-vermelho { background: var(--vermelho); }
.ponto-amarelo { background: var(--amarelo); }

/* ===== Cartões ===== */
.card { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--borda); }
.card-head h3 { font-size: 15px; font-weight: 600; }
.card-acoes { display: flex; gap: 6px; align-items: center; }
.card-body { padding: 16px 18px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.kpi {
  text-align: left; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio);
  padding: 14px 16px 14px 18px; box-shadow: var(--sombra); position: relative; overflow: hidden; min-width: 0;
}
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.kpi-verde::before { background: var(--verde); }
.kpi-azul::before { background: var(--navy-2); }
.kpi-vermelho::before { background: var(--vermelho); }
.kpi-amarelo::before { background: var(--amarelo); }
.kpi-cinza::before { background: var(--borda-forte); }
.kpi-click { cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; }
.kpi-click:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(15,42,74,0.1); }
.kpi-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi-rotulo { font-size: 12.5px; color: var(--texto-2); font-weight: 500; }
.kpi-icon { color: var(--texto-3); font-size: 18px; display: flex; }
.kpi-verde .kpi-icon { color: var(--verde); }
.kpi-vermelho .kpi-icon { color: var(--vermelho); }
.kpi-amarelo .kpi-icon { color: var(--amarelo); }
.kpi-valor { font-size: 30px; font-weight: 700; color: var(--navy); line-height: 1.15; margin-top: 4px; }
.kpi-detalhe { font-size: 12px; color: var(--texto-3); margin-top: 2px; }

/* ===== Filtros e tabelas ===== */
.filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
input, select, textarea {
  border: 1px solid var(--borda-forte); border-radius: var(--raio-sm); background: #fff;
  padding: 8px 10px; min-height: 38px; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
}
textarea { resize: vertical; min-height: 70px; }
input:focus, select:focus, textarea:focus { border-color: var(--verde); box-shadow: 0 0 0 3px var(--verde-claro); }
.busca { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--borda-forte); border-radius: var(--raio-sm); padding: 0 10px; flex: 1; min-width: 220px; max-width: 380px; }
.busca svg { color: var(--texto-3); flex-shrink: 0; }
.busca input { border: 0; padding: 8px 0; box-shadow: none !important; width: 100%; min-height: 36px; }
.busca:focus-within { border-color: var(--verde); box-shadow: 0 0 0 3px var(--verde-claro); }
.busca-grande { max-width: 640px; }
.periodo { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--texto-2); }
.tabela-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--texto-2); margin-top: -6px; }
.tabela-wrap { background: #fff; border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); overflow-x: auto; }
.tabela { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tabela th { text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-2); background: #f8fafc; padding: 10px 14px; border-bottom: 1px solid var(--borda); white-space: nowrap; }
.tabela td { padding: 11px 14px; border-bottom: 1px solid var(--borda); vertical-align: top; }
.tabela tbody tr:last-child td { border-bottom: 0; }
.tabela-wrap .tabela tbody tr { cursor: pointer; }
.tabela-wrap .tabela tbody tr:hover td { background: #f6faf8; }
.tabela .num { text-align: right; }
.td-principal { font-weight: 500; color: var(--navy); }
.td-principal .badge { margin-left: 6px; }
.td-detalhe { font-size: 12.5px; color: var(--texto-2); max-width: 520px; }
.linha-arquivada td { color: var(--texto-3); }
.linha-total td { font-weight: 600; border-top: 1px solid var(--borda-forte); }
.th-btn { border: 0; background: transparent; padding: 0; display: inline-flex; gap: 5px; align-items: center; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
.tabela-compacta { font-size: 13px; }
.tabela-compacta th, .tabela-compacta td { padding: 7px 10px; }
.skeleton { height: 220px; border-radius: var(--raio); background: linear-gradient(90deg, #eef1f4 25%, #f6f8fa 50%, #eef1f4 75%); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }

.vazio { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--texto-2); background: #fff; border: 1px dashed var(--borda-forte); border-radius: var(--raio); }
.card .vazio { border: 0; padding: 22px 10px; }
.vazio strong { color: var(--navy); font-size: 15px; }
.vazio p { margin: 0 0 8px; }
.vazio-icon { font-size: 30px; color: var(--verde); background: var(--verde-claro); width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 6px; }

/* ===== Listas do painel ===== */
.lista-pend, .lista-hist { list-style: none; margin: 0; padding: 0; }
.lista-pend li + li, .lista-hist li + li { border-top: 1px solid var(--borda); }
.lista-pend button, .lista-hist button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; padding: 10px 4px; cursor: pointer; border-radius: 6px; }
.lista-pend button:hover, .lista-hist button:hover { background: #f6faf8; }
.lista-pend button > span:nth-child(2) { flex: 1; }
.lista-pend button > svg { color: var(--texto-3); flex-shrink: 0; }
.lista-pend li.muted { padding: 8px 4px; }
.lh-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lh-txt .muted { font-size: 12px; }
.lh-data { font-size: 12px; color: var(--texto-3); white-space: nowrap; }

.modulos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.modulo { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px; border: 1px solid var(--borda); border-radius: 10px; background: #fff; cursor: pointer; }
.modulo:hover { border-color: var(--verde); background: #f6faf8; }
.modulo-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--navy-claro); color: var(--navy-2); display: grid; place-items: center; font-size: 19px; flex-shrink: 0; }
.modulo-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.modulo-txt strong { color: var(--navy); font-size: 13.5px; }
.modulo-txt span { font-size: 12px; color: var(--texto-3); }

.igq { display: flex; flex-direction: column; gap: 12px; }
.igq-valor { display: flex; align-items: center; gap: 14px; }
.igq-num { font-size: 40px; font-weight: 700; color: var(--navy); line-height: 1; min-width: 70px; }
.igq-formula { margin: 0; font-size: 12.5px; color: var(--texto-2); background: var(--fundo); border-radius: 8px; padding: 10px 12px; }
.pesos { display: flex; flex-direction: column; gap: 8px; }
.peso-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--borda); }
.peso-linha > span { display: flex; flex-direction: column; }
.peso-linha .muted { font-size: 12px; }
.peso-linha input { width: 90px; text-align: right; }
.peso-total { text-align: right; margin-bottom: 0; }

/* ===== Modal e painel lateral ===== */
.overlay { position: fixed; inset: 0; background: rgba(15, 30, 50, 0.45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; animation: fade 0.15s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: #fff; border-radius: 14px; width: 100%; box-shadow: var(--sombra-lg); display: flex; flex-direction: column; max-height: 90vh; animation: sobe 0.18s ease-out; }
@keyframes sobe { from { transform: translateY(10px); opacity: 0; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--borda); }
.modal-head h2 { font-size: 17px; font-weight: 600; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--borda); background: #fafbfc; border-radius: 0 0 14px 14px; flex-wrap: wrap; }
.overlay-drawer { justify-content: flex-end; padding: 0; align-items: stretch; }
.drawer { background: #fff; width: min(560px, 100%); height: 100vh; display: flex; flex-direction: column; box-shadow: var(--sombra-lg); animation: entra 0.2s ease-out; }
@keyframes entra { from { transform: translateX(30px); opacity: 0; } }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
.drawer .modal-foot { border-radius: 0; }
.drawer-titulo { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.confirm-texto { color: var(--texto-2); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo-wide { grid-column: 1 / -1; }
.campo-label { font-size: 12.5px; font-weight: 500; color: var(--texto-2); }
.obrig { color: var(--vermelho); }
.campo-help { font-size: 12px; color: var(--texto-3); }
.campo-msg { font-size: 12px; color: var(--vermelho); }
.campo-erro input, .campo-erro select, .campo-erro textarea, .campo-erro .chips { border-color: var(--vermelho); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0; border-radius: 8px; }
.chip { border: 1px solid var(--borda-forte); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--texto-2); }
.chip:hover { border-color: var(--navy-2); }
.chip-on { background: var(--verde); border-color: var(--verde); color: #fff; }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; min-height: 0; accent-color: var(--verde); }
.check-lista { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
.check-lista label { display: flex; gap: 8px; align-items: center; padding: 5px 0; cursor: pointer; }
.check-lista input { min-height: 0; width: 16px; height: 16px; accent-color: var(--verde); }

.detalhe { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 0; }
.detalhe dt { font-size: 12px; color: var(--texto-3); font-weight: 500; }
.detalhe dd { margin: 2px 0 0; color: var(--texto); word-break: break-word; white-space: pre-wrap; }
.detalhe-wide { grid-column: 1 / -1; }
.secao { margin: 26px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--texto-2); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--borda); }
.timeline > li { position: relative; padding: 0 0 16px 14px; }
.timeline > li::before { content: ""; position: absolute; left: -21px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid var(--verde); }
.tl-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tl-quem { font-weight: 500; font-size: 13px; }
.tl-quando { font-size: 12px; color: var(--texto-3); }
.tl-nota { margin: 6px 0 0; font-size: 13px; color: var(--texto-2); font-style: italic; }
.tl-mud { margin: 6px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--texto-2); }
.tl-mud s { color: var(--texto-3); }

.modo-box { display: flex; gap: 12px; padding: 12px; border-radius: 10px; margin-bottom: 14px; }
.modo-box svg { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
.modo-box p { margin: 2px 0 0; font-size: 13px; }
.modo-nuvem { background: var(--verde-claro); color: var(--verde-escuro); }
.modo-local { background: var(--amarelo-claro); color: #7a4c00; }
.acoes-col { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }

.roadmap { display: flex; gap: 18px; }
.roadmap-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--amarelo-claro); color: var(--amarelo); display: grid; place-items: center; font-size: 26px; flex-shrink: 0; }
.roadmap-itens { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.roadmap-itens li { display: flex; gap: 8px; align-items: flex-start; }
.roadmap-itens svg { color: var(--verde); margin-top: 3px; flex-shrink: 0; }
.roadmap-nota { margin-top: 16px; padding: 12px 14px; background: var(--navy-claro); border-radius: 10px; color: var(--navy); font-size: 13.5px; }

.toasts { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 40px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--navy); color: #fff; box-shadow: var(--sombra-lg); font-size: 13.5px; animation: sobe 0.2s; }
.toast svg { flex-shrink: 0; font-size: 18px; margin-top: 1px; }
.toast-ok svg { color: #4fe0a8; }
.toast-erro { background: #7d1f19; }
.toast-info svg { color: #9cc3f0; }

.splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--texto-2); }
.splash strong { font-size: 20px; color: var(--navy); }

/* ===== Responsivo ===== */
@media (max-width: 1100px) {
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 960px) {
  .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform 0.22s ease; box-shadow: var(--sombra-lg); }
  .menu-aberto .sidebar { transform: none; }
  .menu-aberto .sidebar-veu { display: block; position: fixed; inset: 0; background: rgba(15,30,50,0.45); z-index: 35; }
  .menu-btn { display: grid; }
  .topbar { padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .obra-foco span { display: none; }
  .obra-foco select { min-width: 0; max-width: 220px; }
  .conteudo { padding: 18px 16px 40px; }
  .faixa-local { padding: 8px 16px; display: block; }
}
@media (max-width: 720px) {
  .topbar { display: grid; grid-template-columns: auto 1fr; }
  .busca-global { max-width: none; }
  .obra-foco { grid-column: 1 / -1; margin: 0; }
  .obra-foco select { max-width: none; width: 100%; }
  .pagina-head h1 { font-size: 21px; }
  .pagina-acoes { width: 100%; }
  .pagina-acoes .btn-primary { flex: 1; }
  .filtros > * { flex: 1 1 100%; max-width: none; }
  .periodo { flex: 1 1 calc(50% - 5px) !important; }
  .periodo input { flex: 1; min-width: 0; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi-valor { font-size: 24px; }
  .form-grid, .detalhe, .check-lista { grid-template-columns: 1fr; }
  .overlay { padding: 0; align-items: stretch; }
  .modal { max-height: none; min-height: 100%; border-radius: 0; }
  .modal-foot { border-radius: 0; position: sticky; bottom: 0; }
  .modal-foot .btn { flex: 1; }
  /* Tabelas viram cartões */
  .tabela-wrap { background: transparent; border: 0; box-shadow: none; overflow: visible; }
  .tabela-wrap .tabela thead { display: none; }
  .tabela-wrap .tabela, .tabela-wrap .tabela tbody, .tabela-wrap .tabela tr, .tabela-wrap .tabela td { display: block; width: 100%; }
  .tabela-wrap .tabela tr { background: #fff; border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); margin-bottom: 10px; padding: 10px 14px; }
  .tabela-wrap .tabela td { border: 0; padding: 3px 0; display: flex; gap: 10px; justify-content: space-between; text-align: right; }
  .tabela-wrap .tabela td::before { content: attr(data-label); color: var(--texto-3); font-size: 12px; text-align: left; flex-shrink: 0; }
  .tabela-wrap .tabela td.td-principal { font-size: 15px; text-align: left; justify-content: flex-start; padding-bottom: 6px; flex-wrap: wrap; }
  .tabela-wrap .tabela td.td-principal::before { display: none; }
  .tabela-wrap .tabela td.td-detalhe { flex-direction: column; text-align: left; max-width: none; }
  .tabela-compacta td[data-label="Fórmula"] { display: none; }
  .roadmap { flex-direction: column; }
  .toasts { left: 20px; right: 20px; max-width: none; }
}
@media (max-width: 420px) {
  .kpis { grid-template-columns: 1fr; }
}

@media print {
  .sidebar, .topbar, .faixa-local, .pagina-acoes, .filtros { display: none !important; }
  body { background: #fff; }
  .conteudo { padding: 0; }
}

/* ===== Pré-validação de medições ===== */
.flex-1 { flex: 1; }
.titulo-icone { display: inline-flex; align-items: center; gap: 8px; text-transform: uppercase; font-size: 13px; letter-spacing: 0.04em; }
.titulo-icone svg { color: var(--verde); }
.mv-titulo { display: flex; gap: 14px; align-items: center; }
.mv-titulo h1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mv-titulo h1 .badge { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid #b9e2cf; }
.mv-icone { width: 46px; height: 46px; border-radius: 12px; background: var(--verde-claro); color: var(--verde); display: grid; place-items: center; font-size: 24px; flex-shrink: 0; border: 1px solid #b9e2cf; }
.mv-salvo { display: inline-flex; gap: 6px; align-items: center; }
.mv-params { display: grid; grid-template-columns: 1.4fr 1fr 1.4fr 0.6fr 1.1fr; gap: 14px 16px; }
.mv-cont { float: right; font-weight: 400; }
.mv-params .campo-label { display: block; }
.kpis-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.aviso-inline { display: flex; align-items: center; gap: 6px; margin: -8px 0 0; font-size: 12.5px; color: #8f5900; }
.mv-tabela-card { overflow: hidden; }
.mv-tabela-head { background: var(--navy); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 14px 18px; flex-wrap: wrap; }
.mv-tabela-head h3 { color: #fff; font-size: 15px; }
.mv-tabela-head p { margin: 2px 0 0; font-size: 12.5px; color: #a9bdd4; }
.mv-mes { font-weight: 400; color: #a9bdd4; font-size: 13px; }
.btn-destaque { background: #13a874; }
.btn-destaque:hover { background: var(--verde); }
.mv-erro-itens { padding: 10px 18px 0; display: block; }
.mv-tabela-wrap { overflow-x: auto; }
.mv-tabela { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 980px; }
.mv-tabela th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-2); background: #f8fafc; padding: 10px 8px; border-bottom: 1px solid var(--borda); white-space: nowrap; }
.mv-tabela th.num { text-align: center; }
.mv-tabela td { padding: 8px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
.mv-tabela th.col-medido, .mv-tabela td.col-medido { background: #f1faf6; }
.mv-tabela th.col-medido { color: var(--verde-escuro); }
.mv-tabela input, .mv-tabela select { width: 100%; min-height: 34px; padding: 5px 8px; font-size: 13px; }
.mv-tabela td:nth-child(1) select { min-width: 150px; }
.mv-tabela td:nth-child(2) input { min-width: 220px; }
.mv-tabela .inp-unid { width: 64px; text-align: center; }
.mv-tabela .inp-num { width: 96px; text-align: center; font-weight: 600; }
.mv-tabela .inp-medido { border-color: #7fcbaa; border-width: 1.5px; }
.mv-tabela .inp-erro { border-color: var(--vermelho); background: var(--vermelho-claro); }
.mv-tabela td:nth-child(8) input { min-width: 170px; }
.mv-dif { text-align: center !important; font-weight: 700; white-space: nowrap; }
.mv-dif small { display: block; font-weight: 500; font-size: 11px; color: var(--texto-3); }
.mv-dif.pos { color: var(--vermelho); }
.mv-dif.neg { color: var(--amarelo); }
.mv-div td { background: #fdf5f4; }
.mv-div td.col-medido { background: #fbeceb; }
.sit { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; border: 1px solid; }
.sit::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sit-verde { color: var(--verde-escuro); background: var(--verde-claro); border-color: #b9e2cf; }
.sit-vermelho { color: var(--vermelho); background: var(--vermelho-claro); border-color: #f0c4c0; }
.sit-amarelo { color: #8f5900; background: var(--amarelo-claro); border-color: #f1dcb3; }
.mv-acoes { width: 44px; text-align: center; }
.mv-acoes .icon-btn { font-size: 17px; width: 32px; height: 32px; }
.mv-acoes .icon-btn:hover { color: var(--vermelho); background: var(--vermelho-claro); }
.mv-rodape { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.mv-nota { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; }
.mv-nota svg { color: var(--verde); }
.tl-nota { white-space: pre-line; }
@media (max-width: 1280px) {
  .kpis-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mv-params { grid-template-columns: 1fr 1fr 1fr; }
}
@media (max-width: 720px) {
  .kpis-5 { grid-template-columns: 1fr 1fr; }
  .mv-params { grid-template-columns: 1fr 1fr; }
  .mv-params > .campo:nth-child(1), .mv-params > .campo:nth-child(3) { grid-column: 1 / -1; }
  .mv-titulo h1 { font-size: 20px; }
  .mv-tabela-head .pagina-acoes .btn { flex: 1; }
  /* itens viram cartões editáveis */
  .mv-tabela { min-width: 0; }
  .mv-tabela thead { display: none; }
  .mv-tabela, .mv-tabela tbody, .mv-tabela tr { display: block; width: 100%; }
  .mv-tabela tr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; padding: 12px 14px; border-bottom: 6px solid var(--fundo); position: relative; }
  .mv-tabela td { display: flex; flex-direction: column; gap: 3px; border: 0; padding: 0; background: transparent !important; }
  .mv-tabela td::before { content: attr(data-label); font-size: 11px; color: var(--texto-3); text-transform: uppercase; letter-spacing: 0.04em; }
  .mv-tabela td:nth-child(1), .mv-tabela td:nth-child(2), .mv-tabela td:nth-child(8) { grid-column: 1 / -1; }
  .mv-tabela td:nth-child(1) { padding-right: 40px; }
  .mv-tabela td input, .mv-tabela td select, .mv-tabela .inp-num, .mv-tabela .inp-unid { width: 100%; min-width: 0 !important; }
  .mv-tabela td.mv-dif { text-align: left !important; }
  .mv-acoes { position: absolute; top: 8px; right: 8px; width: auto; }
  .mv-acoes::before { display: none; }
  .mv-rodape .pagina-acoes .btn { flex: 1; }
}


/* ===== Acesso (login) ===== */
.acesso { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 55%, #0c5a45 100%); }
.acesso-caixa { background: #fff; border-radius: 16px; box-shadow: var(--sombra-lg); padding: 28px; width: min(400px, 100%); display: flex; flex-direction: column; gap: 18px; }
.acesso-marca { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.acesso-marca strong { font-size: 20px; color: var(--navy); }
.acesso-marca span { font-size: 13px; color: var(--texto-3); }
.acesso-form { display: flex; flex-direction: column; gap: 12px; }
.acesso-info { text-align: center; color: var(--texto-2); margin: 0; }
.acesso-ok { color: var(--verde-escuro); font-size: 13px; margin: 0; }
.acesso-aviso { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; color: var(--texto-2); }
.acesso-aviso > svg { color: var(--amarelo); font-size: 26px; }
.acesso-aviso p { margin: 0; }
.sb-usuario { display: flex !important; flex-wrap: wrap; gap: 6px; align-items: center; word-break: break-all; }
.sair { border: 1px solid rgba(255,255,255,0.25); background: transparent; color: #c9d6e6; border-radius: 6px; padding: 1px 8px; font-size: 12px; cursor: pointer; }
.sair:hover { background: rgba(255,255,255,0.1); color: #fff; }
.mv-conclusao-wrap { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.mv-conclusao { font-size: 12.5px; padding: 5px 12px; }
.cel-rotulo { display: inline-flex; flex-direction: column; }
.cel-rotulo .muted { font-size: 12px; font-weight: 400; }
